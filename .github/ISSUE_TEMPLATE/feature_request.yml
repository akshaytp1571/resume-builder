name: Feature request
description: Suggest a capability the resume builder should have
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The most useful requests describe the
        **problem**, not just the solution — there is often a simpler fix than
        the one either of us first imagined.

        > **Reminder:** this is a public issue. Do not include real resume data,
        > contact details, photos, credentials or API keys.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This request contains no real personal data or credentials
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the implementation. What are you doing when it hurts?
      placeholder: |
        I apply to roles in three different countries, and each one needs a
        different set of certifications listed first. Right now I duplicate the
        whole variant and edit both by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      placeholder: A way to reorder sections per variant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Workarounds you already use, and why they are not good enough.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Editor / form fields
        - Resume preview or a template
        - A new template
        - PDF export
        - DOCX export
        - ATS score
        - Job-description matcher
        - Cover letter
        - Resume variants / import / export
        - AI integration
        - Job discovery agent
        - Apply agent / form filler
        - Offline / PWA
        - Accessibility
        - Build, deploy or packaging
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Who does this help, and how much?
      description: |
        A rough sense of scale helps prioritise. Is this a blocker for you, a
        papercut, or a nice-to-have?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - label: I would like to open a pull request for this
        - label: I would like guidance on where to start
        - label: I am only suggesting the idea

  - type: checkboxes
    id: constraints
    attributes:
      label: Does this fit the project's constraints?
      description: |
        The app is deliberately local-first, static, and dependency-light. A
        request that needs a backend, an account, or telemetry conflicts with
        that design.
      options:
        - label: This can work fully offline, with no backend and no account
        - label: This would need a network call (describe which, and to whom, above)
