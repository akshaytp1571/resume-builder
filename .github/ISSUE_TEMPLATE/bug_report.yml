name: Bug report
description: Something in the app, a template, an export or the agent is broken
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        > ## ⚠️ Do not paste real resume data
        >
        > This is a **public** issue. Anything you write here is indexed and
        > permanently visible.
        >
        > **Never include** a real name, phone number, email address, home
        > address, photo, employer, job-board login, or API key.
        >
        > Reproduce with the **fictional sample resume** the app ships with
        > (Alex Morgan), or redact before pasting. If you must show a screenshot,
        > blur the personal details first.
        >
        > Found a **security** problem instead? Do not file it here — see
        > [SECURITY.md](https://github.com/akshaytp1571/resume-builder/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This report contains no real personal data, credentials or API keys
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md, not here)
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Be specific.
      placeholder: |
        I opened the template picker, chose "Academic CV", and the preview pane
        went blank. The console showed "Cannot read properties of undefined".
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The preview should re-render with the Academic CV template.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. If it only happens with your own data, say what was unusual about it — not the data itself.
      placeholder: |
        1. npm run dev
        2. Click the Theme tab
        3. Select "Academic CV"
        4. Preview pane goes blank
    validations:
      required: true

  - type: dropdown
    id: sample-data
    attributes:
      label: Can you reproduce it with the shipped sample data?
      description: |
        Click RESET in the navbar to load the fictional sample resume (Alex
        Morgan). If the bug still happens, it is in the app and much easier to
        fix. If it only happens with your data, the shape of your data is
        probably the trigger — describe it without pasting it.
      options:
        - "Yes — it reproduces with the sample data"
        - "No — only with my own resume data"
        - "Not tried yet"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Editor / form fields
        - Resume preview or a template
        - PDF export
        - DOCX export
        - ATS score
        - Job-description matcher
        - Cover letter
        - Resume variants / import / export
        - AI integration
        - Job discovery agent (localhost:3457)
        - Apply agent / form filler
        - Offline / PWA / installability
        - Accessibility
        - Build, deploy or packaging
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag, or the commit SHA if you are on main.
      placeholder: v2.4.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141.0.7390.55
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Run `node -v`. Only relevant for build, test or agent issues.
      placeholder: v24.11.0
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console output or stack trace
      description: Paste the error. Remove any personal data or keys first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: exports
    attributes:
      label: Does it affect an export?
      description: Export bugs are the highest severity — a broken PDF is a missed job application.
      options:
        - label: This affects PDF export
        - label: This affects DOCX export
        - label: This loses or corrupts saved resume data
