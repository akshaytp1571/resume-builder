name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Project Pages are served at /resume-builder/, so assets must resolve
      # under that subpath. The committed config keeps base: '/' (used for the
      # local app and other static hosts); --base here overrides it for this
      # build only. The service worker precache list is root-absolute and will
      # not populate on Pages — the app runs online without offline caching,
      # which is the expected trade for a no-config deploy.
      - name: Build
        run: npm run build -- --base=/resume-builder/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
