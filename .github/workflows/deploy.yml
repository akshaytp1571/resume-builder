name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.12 is the floor, not a preference. Vite 8 accepts ^20.19.0, but
          # Vitest 5 requires ^22.12.0, and `npm test` is the gate this repo
          # claims to have. Node 20 here would build fine and fail the moment
          # anyone added the test step — which is exactly what happened before
          # this was pinned, since the workflow ran build only.
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate. `npm test` chains all four suites with && and exits non-zero
      # on any failure, so a red test blocks the deploy rather than shipping a
      # broken build to Pages.
      - name: Test
        run: npm test

      # 0 errors is the documented bar; warnings are not. Fail on error only.
      - name: Lint
        run: npm run lint

      # Project Pages are served at /resume-builder/, so assets must resolve
      # under that subpath. The committed config keeps base: '/' (used for the
      # local app and other static hosts); --base here overrides it for this
      # build only. The service worker precache list is root-absolute and will
      # not populate on Pages — the app runs online without offline caching,
      # which is the expected trade for a no-config deploy.
      - name: Build
        run: npm run build -- --base=/resume-builder/

      - uses: actions/configure-pages@v5

      # Ship the static landing-page mockups alongside the built app so the
      # directions can be opened live at
      # /resume-builder/previews/<direction>/index.html. `previews/` is
      # self-contained HTML with no build step, so a straight copy is enough.
      # PNG screenshots are gitignored inside previews/, so nothing heavy and
      # nothing from design-sample/ rides along.
      - name: Stage landing previews
        run: |
          mkdir -p dist/previews
          cp -R previews/. dist/previews/
          test -f dist/previews/index.html
          test -f dist/previews/J-daylight-glass/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
