<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #160718;
        color: #fdf2f8;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 2rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 32rem;
        text-align: center;
        border: 1px solid rgba(244, 114, 182, 0.25);
        border-radius: 1rem;
        background: rgba(28, 8, 32, 0.85);
        padding: 2.5rem 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(to right, #fecdd3, #fbcfe8, #fde68a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 0 0 1.75rem; color: rgba(251, 207, 232, 0.7); line-height: 1.6; }
      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(to right, #f43f5e, #ec4899, #f59e0b);
        box-shadow: 0 2px 15px rgba(244, 63, 94, 0.35);
      }
      a:hover { opacity: 0.95; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8em;
        color: #fda4af;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>
        This page does not exist. The resume builder keeps all of its state in
        your browser, so nothing was lost &mdash; just head back to the app.
      </p>
      <a href="/">Open the Resume Builder</a>
    </main>
  </body>
</html>
